<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Bake Data</title>
    
    <!-- Favicon y fuentes de Google -->
    <link rel="icon" href="https://i.imgur.com/WW384uk.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Estilos CSS -->
    <style>
        /* Estilos generales */
        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fffaf0;
        }
        
        /* Barra superior con logo y título */
        .top-bar {
            background-color: #b35340;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
        }
        
        /* Logo en la barra superior */
        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 50px;
            height: auto;
        }
        
        /* Icono derecho en la barra superior */
        .icon-right {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: auto;
        }
        
        /* Barra de navegación */
        .nav-bar {
            display: flex;
            justify-content: center;
            background-color: #4f4f4f;
            padding: 10px;
        }
        
        /* Estilos de los enlaces de navegación */
        .nav-bar a {
            color: white;
            text-decoration: none;
            padding: 10px 40px;
            font-size: 18px;
        }
        
        /* Efecto hover en enlaces de navegación */
        .nav-bar a:hover {
            background-color: #3d3d3d;
            border-radius: 5px;
        }
        
        /* Contenedor principal del contenido */
        .container {
            text-align: justify;
            padding: 50px;
        }
        
        /* Estilo para la tabla de productos */
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }
        
        /* Estilo para las celdas de la tabla */
        .product-table td {
            padding: 20px;
            vertical-align: top;
            border-bottom: 1px solid #e0e0e0;
        }
        
        /* Estilo para la imagen del producto */
        .product-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        /* Estilo para el nombre del producto */
        .product-name {
            font-size: 24px;
            font-weight: bold;
            color: #b35340;
            margin-bottom: 10px;
        }
        
        /* Estilo para el precio */
        .product-price {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }
        
        /* Estilo para la descripción */
        .product-description {
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        /* Estilo para la cantidad */
        .product-quantity {
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        /* Estilo para el input de cantidad */
        .quantity-input {
            width: 60px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        
        /* Estilo para el botón de agregar al carrito */
        .add-to-cart-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #b35340;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        /* Efecto hover en botón de agregar al carrito */
        .add-to-cart-btn:hover {
            background-color: #8f2f26;
        }
    </style>
</head>
<body>
    <!-- Barra superior con logo y título -->
    <div class="top-bar">
        <img src="https://i.imgur.com/WW384uk.png" alt="Logo Bake Data" class="logo">
        <img src="https://i.imgur.com/piX2hC1.png" alt="Icono adicional" class="icon-right">
        Bake Data
    </div>
    
    <!-- Barra de navegación -->
    <div class="nav-bar">
        <a href="#">Realizar Pedido</a>
        <a href="#">Sucursales</a>
        <a href="#">Conócenos</a>
    </div>
    
    <!-- Contenido principal -->
    <div class="container">
        <!-- Tabla de productos -->
        <table class="product-table">
            <tr>
                <td rowspan="5">
                    <img src="https://i.imgur.com/placeholder.jpg" alt="Imagen del producto" class="product-image">
                </td>
                <td>
                    <div class="product-name">Nombre del producto</div>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="product-price">Precio: $XX.XX</div>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="product-description">Descripción:</div>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="product-quantity">
                        Cantidad: <input type="number" min="1" value="1" class="quantity-input">
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <button class="add-to-cart-btn">Agregar al carrito</button>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
