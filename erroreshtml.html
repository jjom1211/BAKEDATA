<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://i.imgur.com/WW384uk.png" type="image/png">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background-color: #fffaf0;
            color: #4f4f4f;
            overflow: hidden;
        }

        .top-bar {
            background-color: #b35340;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
        }

        .separator-line {
            height: 14px;
            background-color: #b35340;
            margin: 0;
            border: none;
        }

        .gray-line {
            height: 5px;
            background-color: #4f4f4f;
            margin: 0;
            border: none;
        }

        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 50px;
            height: auto;
        }

        .icon-right {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: auto;
        }

        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100% - 38px - 5px);
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .error-image {
            width: 40vh;
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: #b35340;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 5px;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <img src="https://i.imgur.com/WW384uk.png" alt="Logo Bake Data" class="logo">
        <img src="https://i.imgur.com/piX2hC1.png" alt="Icono adicional" class="icon-right">
        Bake Data
    </div>

    <hr class="separator-line">
    <hr class="gray-line">

    <div class="error-container">
        <img src="https://imgur.com/g6cd9bQ.png" alt="Error" class="error-image">
        <h1 class="error-title">Lo sentimos, ha ocurrido un error</h1>
        <p class="error-message">Estamos trabajando para solucionarlo. Por favor, intenta nuevamente más tarde.</p>
    </div>
</body>
</html>
