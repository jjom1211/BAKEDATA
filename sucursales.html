<!DOCTYPE html>
<!-- Declaración del tipo de documento HTML5 -->
<html lang="es">
<!-- Define el idioma principal como español -->
<head>
    <!-- Metadatos y recursos externos -->
    <meta charset="UTF-8">
    <!-- Configuración de codificación de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Viewport para diseño responsive -->
    <title>Error</title>
    <!-- Título de la pestaña del navegador -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Importa la fuente Quicksand de Google Fonts -->
    <link rel="icon" href="https://i.imgur.com/WW384uk.png" type="image/png">
    <!-- Favicon de la página -->

    <style>
        /* Estilos CSS para toda la página */

        /* Reset básico y estilos generales */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            background-color: #fffaf0;
            color: #4f4f4f;
            overflow: hidden;
        }

        /* Barra superior con logo y título */
        .top-bar {
            background-color: #b35340;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
        }

        /* Línea decorativa gruesa */
        .separator-line {
            height: 14px;
            background-color: #b35340;
            margin: 0;
            border: none;
        }

        /* Línea decorativa delgada */
        .gray-line {
            height: 5px;
            background-color: #4f4f4f;
            margin: 0;
            border: none;
        }

        /* Estilos para el logo en la barra superior */
        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 50px;
            height: auto;
        }

        /* Estilos para el icono derecho en la barra */
        .icon-right {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: auto;
        }

        /* Contenedor principal del mensaje de error */
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100% - 38px - 5px);
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Estilos para la imagen de error */
        .error-image {
            width: 40vh;
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        /* Estilos para el título del error */
        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: #b35340;
            margin-bottom: 15px;
        }

        /* Estilos para el mensaje descriptivo */
        .error-message {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 5px;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <!-- Barra superior con branding -->
    <div class="top-bar">
        <img src="https://i.imgur.com/WW384uk.png" alt="Logo Bake Data" class="logo">
        <img src="https://i.imgur.com/piX2hC1.png" alt="Icono adicional" class="icon-right">
        Bake Data
    </div>

    <!-- Líneas decorativas -->
    <hr class="separator-line">
    <hr class="gray-line">

    <!-- Contenido principal de error -->
    <div class="error-container">
        <img src="https://imgur.com/g6cd9bQ.png" alt="Error" class="error-image">
        <h1 class="error-title">Lo sentimos, ha ocurrido un error</h1>
        <p class="error-message">Estamos trabajando para solucionarlo. Por favor, intenta nuevamente más tarde.</p>
    </div>
</body>
</html>
