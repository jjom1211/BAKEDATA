            text-align: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
        }
        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 50px;
            height: auto;
        }
        .icon-right {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: auto;
        }
        .nav-bar {
            display: flex;
            justify-content: center;
            background-color: #4f4f4f;
            padding: 10px;
        }
        .nav-bar a {
            color: white;
            text-decoration: none;
            padding: 10px 40px;
            font-size: 18px;
        }
        .nav-bar a:hover {
            background-color: #3d3d3d;
            border-radius: 5px;
        }
        .container {
            text-align: justify;
            padding: 50px;
        }
        .title-gray {
            color: #847c84;
            font-size: 28px;
            font-weight: bold;
        }
        .title-black {
            color: black;
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
        .product-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }
        .left-section {
            display: flex;
            justify-content: flex-start;
        }
        .right-section {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .view-all-btn {
            background-color: #d8a394;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .search-dropdown {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: 'Quicksand', sans-serif;
            color: #b35340;
        }
        .carousel-container {
            display: flex;
            align-items: center;
            overflow: hidden;
            width: 100%;
            position: relative;
            margin: 20px 0;
        }
        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
            padding: 10px 0;
        }
        .carousel-item {
            text-align: center;
            min-width: 220px;
            flex: 0 0 auto;
            cursor: pointer;
            margin: 0 10px;
            transition: transform 0.3s ease;
        }
        .carousel-item:hover {
            transform: scale(1.03);
        }
        .carousel-item img {
            width: 200px;
            height: auto;
            border-radius: 5px;
        }
        .product-name {
            font-size: 20px;
            font-weight: bold;
            margin: 5px 0;
        }
        .product-price {
            font-size: 16px;
            margin: 5px 0;
        }
        .arrow {
            background: rgba(179, 83, 64, 0.7);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        .arrow:hover {
            background: rgba(179, 83, 64, 0.9);
        }
        .left-arrow {
            left: 10px;
        }
        .right-arrow {
            right: 10px;
        }
        .hidden {

                                <div class="carousel-item" data-name="Pan de muerto Medio" onclick="mostrarDetalles('Pan de muerto Medio', 'Pan de temporada')">
                                    <img src="https://via.placeholder.com/200" alt="Pan de muerto Medio">
                                    <p class="product-name">Pan de muerto Medio</p>
                                    <p class="product-price">Precio: $30</p>
                                </div>
                                <div class="carousel-item" data-name="Pan de muerto de chocolate" onclick="mostrarDetalles('Pan de muerto de chocolate', 'Pan de temporada')">
                                    <img src="https://via.placeholder.com/200" alt="Pan de muerto de chocolate">
                                    <p class="product-name">Pan de muerto de chocolate</p>
                                    <p class="product-price">Precio: $45</p>
                                </div>
                                <div class="carousel-item" data-name="Pan de muerto de chocolate Mini" onclick="mostrarDetalles('Pan de muerto de chocolate Mini', 'Pan de temporada')">
                                    <img src="https://via.placeholder.com/200" alt="Pan de muerto de chocolate Mini">
                                    <p class="product-name">Pan de muerto de chocolate Mini</p>
                                    <p class="product-price">Precio: $20</p>
                                </div>
                            </div>
                            <button class="arrow right-arrow" onclick="moveSlide(1, '${categoryId}')">&#10095;</button>
                        </div>
                    `;
                } else {
                    return `
                        <div class="product-section">
                            <div class="left-section">
                                <h2 class="title-black">${category}</h2>
                            </div>
                            <div class="right-section">
                                <select class="search-dropdown" id="search-${categoryId}">
                                    ${options}
                                </select>
                                <button class="view-all-btn">Ver todo</button>
                            </div>
                        </div>
                        <div class="carousel-container">
                            <button class="arrow left-arrow" onclick="moveSlide(-1, '${categoryId}')">&#10094;</button>
                            <div class="carousel" id="carousel-${categoryId}">
                                <div class="carousel-item" onclick="mostrarDetalles('Producto 1', '${category}')">
                                    <img src="https://via.placeholder.com/200" alt="${category} 1">
                                    <p class="product-name">Producto 1</p>
                                    <p class="product-price">Precio por unidad: $5</p>
                                </div>
                            </div>
                            <button class="arrow right-arrow" onclick="moveSlide(1, '${categoryId}')">&#10095;</button>
                        </div>
                    `;
                }
            }).join(''));

            function moveSlide(direction, categoryId) {
                const carousel = document.getElementById(`carousel-${categoryId}`);
                const items = carousel.querySelectorAll('.carousel-item:not(.hidden)');
                const itemWidth = items[0].offsetWidth + 20;
                const containerWidth = carousel.parentElement.offsetWidth;
                const visibleItems = Math.floor(containerWidth / itemWidth);
                const totalItems = items.length;
                
                carouselStates[categoryId].currentIndex += direction;
                const maxIndex = Math.max(totalItems - visibleItems, 0);
                carouselStates[categoryId].currentIndex = Math.max(0, Math.min(carouselStates[categoryId].currentIndex, maxIndex));
                
                const offset = -carouselStates[categoryId].currentIndex * itemWidth;
                carousel.style.transform = `translateX(${offset}px)`;
                
                updateArrows(categoryId, carouselStates[categoryId].currentIndex, maxIndex);
            }

            function updateArrows(categoryId, currentIndex, maxIndex) {
                const leftArrow = document.querySelector(`#carousel-${categoryId} ~ .left-arrow`);
                const rightArrow = document.querySelector(`#carousel-${categoryId} ~ .right-arrow`);
                
                leftArrow.style.display = currentIndex === 0 ? 'none' : 'flex';
                rightArrow.style.display = currentIndex >= maxIndex ? 'none' : 'flex';
            }

            function mostrarDetalles(nombreProducto, categoria) {
                alert(`Producto: ${nombreProducto}\nCategoría: ${categoria}`);
            }

            function filterProducts(categoryId) {
                const select = document.getElementById(`search-${categoryId}`);
                const selectedProduct = select.value;
                const carousel = document.getElementById(`carousel-${categoryId}`);
                const items = carousel.querySelectorAll('.carousel-item');
                
                if (!selectedProduct) {
                    showAllProducts(categoryId);
                    return;
                }
                
                // Ocultar todos los elementos primero
                items.forEach(item => {
                    item.classList.add('hidden');
                });
                
                // Mostrar solo el elemento seleccionado
                const selectedItems = carousel.querySelectorAll(`.carousel-item[data-name="${selectedProduct}"]`);
                if (selectedItems.length > 0) {
                    selectedItems.forEach(item => {
                        item.classList.remove('hidden');
                    });
                    // Mover el carrusel para mostrar el producto seleccionado
                    carouselStates[categoryId].currentIndex = 0;
                    carousel.style.transform = 'translateX(0)';
                } else {
                    // Si no se encuentra el producto, mostrar todos
                    showAllProducts(categoryId);
                    alert('Producto no encontrado');
                }
                
                updateArrows(categoryId, 0, 0);
            }

            function showAllProducts(categoryId) {
                const carousel = document.getElementById(`carousel-${categoryId}`);
                const items = carousel.querySelectorAll('.carousel-item');
                const select = document.getElementById(`search-${categoryId}`);
                
                select.value = '';
                items.forEach(item => {
                    item.classList.remove('hidden');
                });
                
                // Restablecer la posición del carrusel
                carousel.style.transform = 'translateX(0)';
                carouselStates[categoryId].currentIndex = 0;
                
                // Actualizar flechas
                const itemWidth = items[0].offsetWidth + 20;
                const containerWidth = carousel.parentElement.offsetWidth;
                const visibleItems = Math.floor(containerWidth / itemWidth);
                const totalItems = items.length;
                const maxIndex = Math.max(totalItems - visibleItems, 0);
                updateArrows(categoryId, 0, maxIndex);
            }

            window.addEventListener('load', () => {
                categories.forEach(category => {
                    const categoryId = category.replace(/\s/g, '');
                    const carousel = document.getElementById(`carousel-${categoryId}`);
                    if (carousel) {
                        const items = carousel.querySelectorAll('.carousel-item');
                        const itemWidth = items[0].offsetWidth + 20;
                        const containerWidth = carousel.parentElement.offsetWidth;
                        const visibleItems = Math.floor(containerWidth / itemWidth);
                        const totalItems = items.length;
                        const maxIndex = Math.max(totalItems - visibleItems, 0);
                        
                        updateArrows(categoryId, 0, maxIndex);
                    }
                });
            });
        </script>
    </div>
</body>
</html>
