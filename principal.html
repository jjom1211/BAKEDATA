<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bake Data - Inicio</title>
    
    <!-- Favicon y fuentes de Google -->
    <link rel="icon" href="https://i.imgur.com/WW384uk.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Estilos CSS -->
    <style>
        /* Estilos generales */
        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fffaf0;
        }
        
        /* Barra superior con logo y título */
        .top-bar {
            background-color: #b35340;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
        }
        
        /* Logo en la barra superior */
        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 50px;
            height: auto;
        }
        
        /* Icono derecho en la barra superior */
        .icon-right {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: auto;
        }
        
        /* Barra de navegación */
        .nav-bar {
            display: flex;
            justify-content: center;
            background-color: #4f4f4f;
            padding: 10px;
        }
        
        /* Estilos de los enlaces de navegación */
        .nav-bar a {
            color: white;
            text-decoration: none;
            padding: 10px 40px;
            font-size: 18px;
        }
        
        /* Efecto hover en enlaces de navegación */
        .nav-bar a:hover {
            background-color: #3d3d3d;
            border-radius: 5px;
        }
        
        /* Contenedor principal del contenido */
        .container {
            text-align: justify;
            padding: 50px;
        }
        
        /* Título principal en color gris */
        .title-gray {
            color: #847c84;
            font-size: 28px;
            font-weight: bold;
        }
        
        /* Título de categoría en negro */
        .title-black {
            color: black;
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }
        
        /* Sección de productos (título + controles) */
        .product-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        /* Sección izquierda (título de categoría) */
        .left-section {
            display: flex;
            justify-content: flex-start;
        }
        
        /* Sección derecha (búsqueda + botón) */
        .right-section {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        /* Botón "Ver todo" */
        .view-all-btn {
            background-color: #d8a394;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* Selector de búsqueda */
        .search-dropdown {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: 'Quicksand', sans-serif;
            color: #b35340;
        }
        
        /* Contenedor del carrusel */
        .carousel-container {
            display: flex;
            align-items: center;
            overflow: hidden;
            width: 100%;
            position: relative;
            margin: 20px 0;
        }
        
        /* Carrusel de productos */
        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
            padding: 10px 0;
        }
        
        /* Elemento individual del carrusel */
        .carousel-item {
            text-align: center;
            min-width: 220px;
            flex: 0 0 auto;
            cursor: pointer;
            margin: 0 10px;
            transition: transform 0.3s ease;
        }
        
        /* Efecto hover para productos */
        .carousel-item:hover {
            transform: scale(1.03);
        }
        
        /* Imagen del producto en el carrusel */
        .carousel-item img {
            width: 200px;
            height: auto;
            border-radius: 5px;
        }
        
        /* Nombre del producto */
        .product-name {
            font-size: 20px;
            font-weight: bold;
            margin: 5px 0;
        }
        
        /* Precio del producto */
        .product-price {
            font-size: 16px;
            margin: 5px 0;
        }
        
        /* Flechas del carrusel */
        .arrow {
            background: rgba(179, 83, 64, 0.7);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        
        .arrow:hover {
            background: rgba(179, 83, 64, 0.9);
        }
        
        /* Flecha izquierda */
        .left-arrow {
            left: 10px;
        }
        
        /* Flecha derecha */
        .right-arrow {
            right: 10px;
        }
    </style>
</head>

            function moveSlide(direction, categoryId) {
                const carousel = document.getElementById(`carousel-${categoryId}`);
                const items = carousel.querySelectorAll('.carousel-item');
                const itemWidth = items[0].offsetWidth + 20; // Ancho del elemento + margen
                const containerWidth = carousel.parentElement.offsetWidth;
                const visibleItems = Math.floor(containerWidth / itemWidth);
                const totalItems = items.length;
                
                // Actualizar el índice actual
                carouselStates[categoryId].currentIndex += direction;
                
                // Asegurarse de que el índice no sea menor que 0 ni mayor que el máximo permitido
                const maxIndex = Math.max(totalItems - visibleItems, 0);
                carouselStates[categoryId].currentIndex = Math.max(0, Math.min(carouselStates[categoryId].currentIndex, maxIndex));
                
                // Calcular el desplazamiento
                const offset = -carouselStates[categoryId].currentIndex * itemWidth;
                carousel.style.transform = `translateX(${offset}px)`;
                
                // Ocultar/mostrar flechas según la posición
                updateArrows(categoryId, carouselStates[categoryId].currentIndex, maxIndex);
            }

            function updateArrows(categoryId, currentIndex, maxIndex) {
                const leftArrow = document.querySelector(`#carousel-${categoryId} ~ .left-arrow`);
                const rightArrow = document.querySelector(`#carousel-${categoryId} ~ .right-arrow`);
                
                leftArrow.style.display = currentIndex === 0 ? 'none' : 'flex';
                rightArrow.style.display = currentIndex >= maxIndex ? 'none' : 'flex';
            }

            function mostrarDetalles(nombreProducto, categoria) {
                alert(`Producto: ${nombreProducto}\nCategoría: ${categoria}`);
                // Implementa aquí la lógica para mostrar detalles
            }

            // Inicializar flechas al cargar la página
            window.addEventListener('load', () => {
                categories.forEach(category => {
                    const categoryId = category.replace(/\s/g, '');
                    const carousel = document.getElementById(`carousel-${categoryId}`);
                    if (carousel) {
                        const items = carousel.querySelectorAll('.carousel-item');
                        const itemWidth = items[0].offsetWidth + 20;
                        const containerWidth = carousel.parentElement.offsetWidth;
                        const visibleItems = Math.floor(containerWidth / itemWidth);
                        const totalItems = items.length;
                        const maxIndex = Math.max(totalItems - visibleItems, 0);
                        
                        updateArrows(categoryId, 0, maxIndex);
                    }
                });
            });
        </script>
    </div>
</body>
</html>
