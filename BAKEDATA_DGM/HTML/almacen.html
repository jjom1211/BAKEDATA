<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén</title>
    <link rel="icon" href="https://i.imgur.com/ub3kCNp.png" type="image/png" sizes="16x16">
    <link rel="stylesheet" href ="../CSS/gen.css">
</head>
<body>
        <!-- Botón para abrir/cerrar la sidebar -->
        <button class="open-sidebar" onclick="toggleSidebar()">☰</button>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Imagen de fondo -->
            <div class="sidebar-background"></div>
            <!-- Contenido de la sidebar -->
            <div class="sidebar-content">
                <img src="https://i.imgur.com/ub3kCNp.png" alt="Gerencia" class="sidebar-logo" sizes="16x16">
                <button class="button admin-only" onclick="window.location.href='almacen.html'">Almacén</button>
                <button class="button admin-only" onclick="window.location.href='reparto.html'">Reparto</button>
                <button class="button admin-only" onclick="window.location.href='usuario.html'">Usuario</button>
                <button class="button admin-only" onclick="window.location.href='produccion.html'">Producción</button>
                <button class="button admin-only" onclick="window.location.href='ventas.html'">Ventas</button>
                <button class="button admin-only" onclick="window.location.href='limpieza.html'">Limpieza</button>
                <button class="button admin-only" onclick="window.location.href='reportes.html'">Reportes</button>
                <button class="button admin-only" onclick="window.location.href='gerente.html'"> Gerente</button>
                <button class="button return-login" onclick="window.location.href='login.html'">
                <img src="https://i.imgur.com/ft5fWsY.png"  alt="Regresar al Inicio" class="return-icon">
            </div>
        </div>
    
    <div class="container">
        <h1>Almacén</h1>
        <div class="button" onclick="registrarEntradas()">Registrar Entradas</div>
        <div class="button" onclick="actualizarMateriaPrima()">Actualizar Materia Prima</div>
        <div class="button" onclick="registrarSalidas()">Registrar Salidas</div>
        <div class="button" onclick="actualizarProductos()">Actualizar Productos</div>
        <div class="button" onclick="verProductos()">Ver Productos</div>
        <div class="button" onclick="verMateriasPrimas()" >Ver Materias Primas</div>
        <div class="button admin-only" onclick="solicitarProductos()">Solicitar Productos</div>
        <div class="button admin-only" onclick="solicitarMateriaPrima()"> Solicitar Materia Prima</div>
        <div class="button admin-only" onclick="enviarProductosaTienda()">Enviar Productos a Tienda</div>
    </div>
    <script src="../JS/alm.js"></script>

</html>
