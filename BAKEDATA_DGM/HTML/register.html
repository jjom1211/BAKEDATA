<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="icon" href="https://i.imgur.com/ub3kCNp.png" type="image/png" sizes="16x16">
    <link rel="stylesheet" href="../CSS/register.css">
</head>
<body>
    <h1>Bienvenido a Bake Data</h1>
    
    <!-- Imagen agregada debajo del título -->
    <img src="https://i.imgur.com/ub3kCNp.png" alt="Logo" class="logo">

    <div class="content-box">
        <span><em>Por favor ingresa tus datos para registrarte</em>.</span>
        <br>
        <form onsubmit="enviarFormulario(event)">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono" required>

            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" required>

            <div class="password-container">
                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" name="contraseña" required>
                <span class="toggle-password" onclick="togglePassword('contraseña')">👁‍🗨</span>
            </div>

            <div class="password-container">
                <label for="confirmacion_de_contraseña">Confirmación de contraseña:</label>
                <input type="password" id="confirmacion_de_contraseña" name="confirmacion_de_contraseña" required>
                <span class="toggle-password" onclick="togglePassword('confirmacion_de_contraseña')">👁‍🗨</span>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>

    <script src="../JS/register.js"></script>
</body>
</html>
